# Contoh konfigurasi Nginx untuk Marshal Frontend (SPA + reverse proxy API).
# Ganti upstream `marshal_backend` sesuai alamat backend nyata.

upstream marshal_backend {
  server backend:8000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Aset ber-hash: cache panjang & immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html tidak di-cache permanen.
  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # Semua request non-asset diarahkan ke SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API ke backend.
  location /api/ {
    proxy_pass http://marshal_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
