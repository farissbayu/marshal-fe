# Example Nginx configuration for Marshal Frontend (SPA + reverse proxy API).
# Replace the `marshal_backend` upstream with the real backend address.

upstream marshal_backend {
  server backend:8000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Hashed assets: long cache & immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html is not cached permanently.
  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # All non-asset requests fall back to the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the backend.
  location /api/ {
    proxy_pass http://marshal_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
